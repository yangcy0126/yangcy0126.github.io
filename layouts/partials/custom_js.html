<script>
(function () {
  function initLanguageSwitcher() {
    var root = document.querySelector("#navbar-main .i18n-dropdown");
    if (!root || root.classList.contains("language-switcher-ready")) {
      return;
    }

    var currentLanguage = root.getAttribute("data-current-language");
    var links = Array.prototype.slice.call(root.querySelectorAll("a[data-language]"));
    var sections = Array.prototype.slice.call(document.querySelectorAll(".home-section[id]"));
    var navbar = document.getElementById("navbar-main");
    var updatePending = false;
    var prefetched = false;

    function showLanguage(language) {
      root.setAttribute("data-current-language", language);
      links.forEach(function (link) {
        if (link.getAttribute("data-language") === language) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });
    }

    function currentSection() {
      var id = "";
      var readingLine = navbar.getBoundingClientRect().bottom + 80;
      sections.forEach(function (section) {
        if (section.getBoundingClientRect().top <= readingLine) {
          id = section.id;
        }
      });
      return id === "about" ? "" : id;
    }

    function updateLinks() {
      var section = currentSection();
      links.forEach(function (link) {
        var isChinese = link.getAttribute("data-language") === "zh";
        // Chinese publications share a single section on the Chinese homepage.
        var targetSection = isChinese && section === "contributionsInChinese" ? "featuredPublications" : section;
        link.href = (isChinese ? "/cn/" : "/") + (targetSection ? "#" + targetSection : "");
      });
      updatePending = false;
    }

    function scheduleUpdate() {
      if (!updatePending) {
        updatePending = true;
        window.requestAnimationFrame(updateLinks);
      }
    }

    function prefetchLanguage(link) {
      updateLinks();
      if (prefetched || link.getAttribute("data-language") === currentLanguage ||
          (navigator.connection && navigator.connection.saveData)) {
        return;
      }
      var hint = document.createElement("link");
      hint.rel = "prefetch";
      hint.href = link.pathname;
      document.head.appendChild(hint);
      prefetched = true;
    }

    links.forEach(function (link) {
      ["pointerenter", "focus", "pointerdown"].forEach(function (eventName) {
        link.addEventListener(eventName, function () { prefetchLanguage(link); });
      });
      link.addEventListener("click", function (event) {
        updateLinks();
        if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
          return;
        }
        var language = link.getAttribute("data-language");
        if (language === currentLanguage) {
          event.preventDefault();
          return;
        }
        showLanguage(language);
      });
    });

    window.addEventListener("scroll", scheduleUpdate, { passive: true });
    window.addEventListener("resize", scheduleUpdate);
    window.addEventListener("pageshow", function () {
      showLanguage(currentLanguage);
      updateLinks();
    });

    // Cancel the theme's extra anchor animation only on a language-switch arrival.
    var previous = document.referrer ? new URL(document.referrer) : null;
    if (previous && previous.origin === window.location.origin &&
        /^\/(?:cn\/?)?$/.test(previous.pathname) &&
        (/^\/cn(?:\/|$)/.test(previous.pathname) !== (currentLanguage === "zh")) &&
        window.location.hash) {
      window.addEventListener("load", function () {
        var section = document.getElementById(window.location.hash.slice(1));
        if (section) {
          if (window.jQuery) {
            window.jQuery("html, body").stop(true);
            document.body.classList.remove("scrolling");
          }
          window.scrollTo(0, Math.ceil(section.getBoundingClientRect().top + window.scrollY - navbar.offsetHeight));
          updateLinks();
        }
      }, { once: true });
    }

    updateLinks();
    root.classList.add("language-switcher-ready");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initLanguageSwitcher);
  } else {
    initLanguageSwitcher();
  }
}());
</script>

<script>
(function () {
  if (window.__awardCertificatePreviewInitialized) {
    return;
  }

  window.__awardCertificatePreviewInitialized = true;

  function parseEntries(trigger) {
    var list = trigger.getAttribute("data-pdfs");
    if (list) {
      return list.split(";").map(function (item) {
        var parts = item.split("|");
        return {
          label: parts.shift(),
          url: parts.join("|")
        };
      }).filter(function (entry) {
        return entry.url;
      });
    }

    var url = trigger.getAttribute("data-pdf");
    return url ? [{ label: "PDF", url: url }] : [];
  }

  function createPanel() {
    var panel = document.createElement("div");
    var isChinese = /^zh/i.test(document.documentElement.lang || "");
    panel.className = "award-certificate-preview";
    panel.setAttribute("aria-hidden", "true");
    panel.innerHTML = [
      '<div class="award-certificate-preview-header">',
      "<span>" + (isChinese ? "获奖证书" : "Certificate") + "</span>",
      '<div class="award-certificate-preview-actions"></div>',
      "</div>",
      '<iframe title="' + (isChinese ? "获奖证书预览" : "Award certificate preview") + '" loading="lazy"></iframe>'
    ].join("");
    document.body.appendChild(panel);
    return panel;
  }

  function initAwardCertificatePreview() {
    var triggers = Array.prototype.slice.call(document.querySelectorAll(".award-certificate-trigger[data-pdf], .award-certificate-trigger[data-pdfs]"));
    if (!triggers.length) {
      return;
    }

    var panel = createPanel();
    var frame = panel.querySelector("iframe");
    var actions = panel.querySelector(".award-certificate-preview-actions");
    var hideTimer = null;
    var hoverQuery = window.matchMedia("(hover: hover)");

    function setActiveUrl(url) {
      if (frame.getAttribute("src") !== url) {
        frame.setAttribute("src", url);
      }

      Array.prototype.forEach.call(actions.querySelectorAll("a"), function (link) {
        link.classList.toggle("is-active", link.getAttribute("href") === url);
      });
    }

    function show(trigger) {
      var entries = parseEntries(trigger);
      if (!entries.length) {
        return;
      }

      window.clearTimeout(hideTimer);
      actions.innerHTML = "";
      entries.forEach(function (entry, index) {
        var link = document.createElement("a");
        link.href = entry.url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = entry.label || "PDF";
        link.addEventListener("mouseenter", function () {
          setActiveUrl(entry.url);
        });
        link.addEventListener("focus", function () {
          setActiveUrl(entry.url);
        });
        link.addEventListener("click", function (event) {
          event.stopPropagation();
        });
        actions.appendChild(link);
        if (index === 0) {
          setActiveUrl(entry.url);
        }
      });

      panel.classList.add("is-visible");
      panel.setAttribute("aria-hidden", "false");
    }

    function hide() {
      panel.classList.remove("is-visible");
      panel.setAttribute("aria-hidden", "true");
    }

    function scheduleHide() {
      window.clearTimeout(hideTimer);
      hideTimer = window.setTimeout(hide, 160);
    }

    triggers.forEach(function (trigger) {
      trigger.setAttribute("tabindex", "0");
      trigger.setAttribute("role", "link");
      trigger.addEventListener("mouseenter", function () {
        show(trigger);
      });
      trigger.addEventListener("focus", function () {
        show(trigger);
      });
      trigger.addEventListener("mouseleave", scheduleHide);
      trigger.addEventListener("blur", scheduleHide);
      trigger.addEventListener("click", function () {
        var entries = parseEntries(trigger);
        if (entries.length && !hoverQuery.matches) {
          window.open(entries[0].url, "_blank", "noopener");
        }
      });
      trigger.addEventListener("keydown", function (event) {
        var entries = parseEntries(trigger);
        if (entries.length && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          window.open(entries[0].url, "_blank", "noopener");
        }
      });
    });

    panel.addEventListener("mouseenter", function () {
      window.clearTimeout(hideTimer);
    });
    panel.addEventListener("mouseleave", scheduleHide);
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        hide();
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initAwardCertificatePreview);
  } else {
    initAwardCertificatePreview();
  }
}());
</script>
